version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL 16 (System of Record)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: worksphere-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-worksphere}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worksphere"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worksphere-prod-network

  # ==========================================
  # 2. Redis 7 (Queues & Pub/Sub)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: worksphere-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - worksphere-prod-network

  # ==========================================
  # 3. Express Core REST API & Sockets
  # ==========================================
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: worksphere-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/worksphere?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-worksphere_prod_access_secret_key_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-worksphere_prod_refresh_secret_key_change_me}
      ANALYTICS_SERVICE_URL: http://analytics:8000
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-worksphere_internal_analytics_api_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - worksphere-prod-network

  # ==========================================
  # 4. FastAPI Analytics Engine
  # ==========================================
  analytics:
    build:
      context: ..
      dockerfile: apps/analytics/Dockerfile
    container_name: worksphere-prod-analytics
    restart: always
    environment:
      ENVIRONMENT: production
      INTERNAL_API_KEY: ${ANALYTICS_API_KEY:-worksphere_internal_analytics_api_secret_key}
    networks:
      - worksphere-prod-network

  # ==========================================
  # 5. Next.js Web Frontend
  # ==========================================
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: worksphere-prod-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_ANALYTICS_URL: http://localhost/analytics
    depends_on:
      - api
    networks:
      - worksphere-prod-network

  # ==========================================
  # 6. Nginx Edge Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: worksphere-prod-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - analytics
    networks:
      - worksphere-prod-network

volumes:
  postgres_prod_data:
    name: worksphere_postgres_prod_data
  redis_prod_data:
    name: worksphere_redis_prod_data

networks:
  worksphere-prod-network:
    name: worksphere-prod-network
    driver: bridge
