name: WorkSphere Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==========================================
  # 1. Typecheck & Linting
  # ==========================================
  typecheck:
    name: Typecheck & Code Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build --workspace=packages/shared-types

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build Express API (TypeScript Compile)
        run: npm run build --workspace=apps/api

  # ==========================================
  # 2. Node.js Core API & OCC Test Suite
  # ==========================================
  api-tests:
    name: Backend API & OCC Concurrency Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build --workspace=packages/shared-types

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run Jest & Supertest Test Suites
        run: npm test --workspace=apps/api
        env:
          JWT_ACCESS_SECRET: ci_test_access_secret_key_12345
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_12345

  # ==========================================
  # 3. Python FastAPI Analytics Test Suite
  # ==========================================
  python-tests:
    name: Python FastAPI Analytics & Streaming Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/analytics/requirements.txt

      - name: Run Pytest Test Suite
        working-directory: ./apps/analytics
        run: pytest -v

  # ==========================================
  # 4. Next.js Frontend Production Build
  # ==========================================
  web-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build --workspace=packages/shared-types

      - name: Build Next.js Production Bundle
        run: npm run build --workspace=apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
